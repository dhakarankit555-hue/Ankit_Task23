<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen">

    <nav class="bg-white shadow-md p-5">
        <a href="index.html" class="text-2xl font-bold">
            Project<span class="text-orange-500">.</span>
        </a>
    </nav>

    <section class="flex justify-center items-center px-6 py-16">
        <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg">
            <h1 class="text-3xl font-bold text-center text-gray-900">
                Create Account
            </h1>

            <p class="text-gray-500 text-center mt-2">
                Join Project and organize your work.
            </p>

            <form class="mt-8">
                <label class="block text-gray-700 mb-2">Full Name</label>
                <input type="text" placeholder="Enter your name"
                       class="w-full border rounded-lg px-4 py-3 mb-5">

                <label class="block text-gray-700 mb-2">Email</label>
                <input type="email" placeholder="Enter your email"
                       class="w-full border rounded-lg px-4 py-3 mb-5">

                <label class="block text-gray-700 mb-2">Password</label>
                <input type="password" placeholder="Create a password"
                       class="w-full border rounded-lg px-4 py-3">

                <button type="button"
                        class="w-full mt-6 bg-orange-500 text-white py-3 rounded-lg hover:bg-orange-600">
                    Create Account
                </button>
            </form>

            <p class="text-center text-gray-600 mt-6">
                Already have an account?
                <a href="login.html" class="text-orange-600 font-semibold">
                    Log in
                </a>
            </p>

            <div class="text-center mt-6">
                <a href="index.html" class="text-orange-600 hover:underline">
                    Back to Home
                </a>
            </div>
        </div>
    </section>

</body>
</html>
